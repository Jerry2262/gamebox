name: Deploy Pages

# 把分文件版游戏发布成可在线玩的静态页：https://jerry2262.github.io/gamebox/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v6

      # 分文件版本身就是纯静态页面，直接作为站点根目录发布
      - uses: actions/upload-pages-artifact@v5
        with:
          path: gamebox

      - id: deploy
        uses: actions/deploy-pages@v5
